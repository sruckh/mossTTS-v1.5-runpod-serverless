<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/>
  <rect width="1198" height="418" x="1" y="1" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5" rx="15"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="100" r="140" fill="#06B6D4" opacity="0.12" filter="url(#glow-cyan)"/>
  <circle cx="1000" cy="320" r="160" fill="#8B5CF6" opacity="0.15" filter="url(#glow-purple)"/>

  <!-- Subtle Tech Grid Background Pattern -->
  <g opacity="0.05" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
  </g>

  <!-- Header Title & Subtitle -->
  <g transform="translate(60, 75)">
    <!-- Pill Badge -->
    <rect width="210" height="28" rx="14" fill="#0E7490" fill-opacity="0.25" stroke="#06B6D4" stroke-opacity="0.5" stroke-width="1"/>
    <text x="14" y="18" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">RUNPOD SERVERLESS</text>

    <!-- Main Title -->
    <text x="0" y="75" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">MOSS-TTS-v1.5</text>
    <text x="320" y="75" fill="url(#accent-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">API Engine</text>

    <!-- Subtitle -->
    <text x="0" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">High-Performance Text-to-Speech &amp; Zero-Shot Voice Cloning GPU Endpoint</text>
  </g>

  <!-- Audio Waveform Visual Graphic -->
  <g transform="translate(60, 230)">
    <!-- Waveform Bars -->
    <rect x="0" y="25" width="6" height="30" rx="3" fill="#06B6D4" opacity="0.8"/>
    <rect x="12" y="15" width="6" height="50" rx="3" fill="#06B6D4"/>
    <rect x="24" y="5" width="6" height="70" rx="3" fill="#38BDF8"/>
    <rect x="36" y="20" width="6" height="40" rx="3" fill="#3B82F6"/>
    <rect x="48" y="0" width="6" height="80" rx="3" fill="url(#accent-grad)"/>
    <rect x="60" y="10" width="6" height="60" rx="3" fill="#6366F1"/>
    <rect x="72" y="25" width="6" height="30" rx="3" fill="#8B5CF6"/>
    <rect x="84" y="5" width="6" height="70" rx="3" fill="#A855F7"/>
    <rect x="96" y="20" width="6" height="40" rx="3" fill="#06B6D4"/>
    <rect x="108" y="30" width="6" height="20" rx="3" fill="#38BDF8" opacity="0.6"/>
  </g>

  <!-- Metric Badges Row -->
  <g transform="translate(200, 235)">
    <!-- Feature Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="165" height="65" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="28" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600">COLD START</text>
      <text x="16" y="50" fill="#38BDF8" font-family="sans-serif" font-size="18" font-weight="700">&lt; 3.5 Seconds</text>
    </g>
    <!-- Feature Pill 2 -->
    <g transform="translate(180, 0)">
      <rect width="165" height="65" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="28" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600">EXECUTION MODE</text>
      <text x="16" y="50" fill="#818CF8" font-family="sans-serif" font-size="18" font-weight="700">Dual Streaming</text>
    </g>
    <!-- Feature Pill 3 -->
    <g transform="translate(360, 0)">
      <rect width="165" height="65" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="28" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600">ATTENTION ENGINE</text>
      <text x="16" y="50" fill="#C084FC" font-family="sans-serif" font-size="18" font-weight="700">FlashAttn-2</text>
    </g>
  </g>

  <!-- Right Side Interactive Code Spec Card -->
  <g transform="translate(750, 60)">
    <rect width="390" height="300" rx="12" fill="#090D16" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Window Bar -->
    <rect width="390" height="36" rx="12" fill="#0F172A"/>
    <circle cx="20" cy="18" r="5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="5" fill="#10B981"/>
    <text x="145" y="22" fill="#64748B" font-family="monospace" font-size="12">payload.json</text>

    <!-- Code Contents -->
    <g transform="translate(20, 60)" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="12">
      <text y="0" fill="#64748B">{</text>
      <text y="20" fill="#7DD3FC">  "input"<fill="#64748B">: {</fill></text>
      <text y="40" fill="#7DD3FC">    "text"<fill="#64748B">: </fill><fill="#FDE047">"Hello world!"</fill><fill="#64748B">,</fill></text>
      <text y="60" fill="#7DD3FC">    "language"<fill="#64748B">: </fill><fill="#FDE047">"English"</fill><fill="#64748B">,</fill></text>
      <text y="80" fill="#7DD3FC">    "stream"<fill="#64748B">: </fill><fill="#F43F5E">true</fill><fill="#64748B">,</fill></text>
      <text y="100" fill="#7DD3FC">    "reference_audio_base64"<fill="#64748B">: </fill><fill="#FDE047">"..."</fill></text>
      <text y="120" fill="#64748B">  }</text>
      <text y="140" fill="#64748B">}</text>

      <!-- Divider -->
      <line x1="0" y1="165" x2="350" y2="165" stroke="#1E293B" stroke-width="1"/>

      <!-- Response status -->
      <text y="188" fill="#10B981">✓ HTTP 200 OK</text>
      <text y="208" fill="#94A3B8">Content-Type: application/json</text>
      <text y="228" fill="#38BDF8">status: "streaming" | "success"</text>
    </g>
  </g>
</svg>
